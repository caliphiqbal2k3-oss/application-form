<style>
/* Layout: a mock office form on blue-ruled paper, one card per question, red rubber-stamp accent. */
:root {
  --paper: #f3f5f9; --sheet: #ffffff; --ink: #1b2440; --ink-soft: #5a6383; --rule: #d6dcea;
  --blue: #2d4fd6; --blue-soft: #e6ebfc; --stamp: #d23a3a; --stamp-soft: #fbe7e5;
  --skip: #8a7a1f; --skip-soft: #f7f0cc; --good: #1f8a4c; --good-soft: #def3e6;
  --cjk: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC";
  --font: "Bricolage Grotesque", "Avenir Next", "Segoe UI", var(--cjk), system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, var(--cjk), monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #10131c; --sheet: #181d2a; --ink: #e7eaf4; --ink-soft: #9aa3c0; --rule: #2b3247;
    --blue: #8fa6ff; --blue-soft: #222c4d; --stamp: #ff7a72; --stamp-soft: #3a1f22;
    --skip: #e3cf6b; --skip-soft: #36311a; --good: #5fd18f; --good-soft: #17301f; color-scheme: dark;
  }
}
:root:lang(zh-Hant) { --cjk: "PingFang TC", "Heiti TC", "Microsoft JhengHei", "Noto Sans TC"; }
* { box-sizing: border-box; }
.langs { display: flex; gap: 4px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 999px; padding: 3px; align-self: center; }
.langs button { font: 600 13px var(--font); padding: 5px 12px; border-radius: 999px; border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.langs button:lang(zh-Hant) { font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", var(--font); }
details.zh { border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
details.zh > summary { font: 600 14px var(--mono); cursor: pointer; }
details.zh[open] > summary { margin-bottom: 8px; }
.zhbox { display: flex; flex-direction: column; gap: 10px; padding-block: 8px; border-top: 1px dashed var(--rule); }
.zhbox:lang(zh-Hant) { font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", var(--font); }
.f .meta { text-transform: none; letter-spacing: 0; font-weight: 400; }
a.small { text-decoration: none; display: inline-block; align-self: flex-start; }
.tr-link { color: var(--blue); }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5;
  padding-inline: 16px; padding-block: env(safe-area-inset-top, 0px) calc(48px + env(safe-area-inset-bottom, 0px)); }
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
[hidden] { display: none !important; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); padding: 10px 16px; margin-inline: -16px; border-bottom: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
.progress { display: flex; align-items: center; gap: 10px; font: 500 12px var(--mono); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .a { background: var(--blue); } .bar .s { background: var(--skip); }
.savestate { font: 11px var(--mono); color: var(--ink-soft); text-align: right; }

.head { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 22px 18px; margin-top: 16px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
.formno { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
h1 { font-family: var(--font); font-weight: 800; font-size: clamp(28px, 8vw, 40px); line-height: 1.04; margin: 0; text-wrap: balance; letter-spacing: -.02em; }
h2 { font: 800 22px var(--font); margin: 0; text-wrap: balance; }
.funline { padding: 10px 12px; background: var(--blue-soft); border-radius: 6px; font-size: 15px; display: flex; flex-direction: column; gap: 4px; }
.praise { font-weight: 600; }
.stamp { position: absolute; right: -6px; top: 14px; transform: rotate(9deg); border: 3px solid var(--stamp); color: var(--stamp); font: 700 12px var(--mono); letter-spacing: .12em; padding: 4px 8px; border-radius: 4px; opacity: .85; }
.msg { font-size: 14px; color: var(--ink-soft); }
.err { font-size: 14px; color: var(--stamp); }

.section { display: flex; flex-direction: column; gap: 10px; }
.sec-h { margin-top: 18px; font: 800 19px var(--font); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
.sec-h small { display: block; font: 600 12px var(--mono); color: var(--stamp); letter-spacing: .06em; }

.q { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.q.done { border-left: 4px solid var(--blue); }
.q.skipped { border-left: 4px solid var(--skip); background: var(--skip-soft); }
.q-top { display: flex; gap: 10px; align-items: flex-start; }
.q-text { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.hint { font: 12px var(--mono); color: var(--ink-soft); }
.skipbtn { flex: none; font: 600 12px var(--mono); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--rule); background: transparent; color: var(--ink-soft); cursor: pointer; }
.q.skipped .skipbtn { background: var(--skip); border-color: var(--skip); color: var(--sheet); }
.q.skipped .body { opacity: .4; pointer-events: none; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 6px; background: transparent; color: var(--ink); font: 15px var(--font); cursor: pointer; }
.box { flex: none; width: 18px; height: 18px; border: 2px solid var(--ink-soft); border-radius: 3px; display: grid; place-items: center; font: 700 13px var(--mono); color: var(--sheet); }
.opt[aria-pressed="true"] { border-color: var(--blue); background: var(--blue-soft); }
.opt[aria-pressed="true"] .box { background: var(--blue); border-color: var(--blue); }
.rate { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.rate button { padding: 9px 0; border: 1px solid var(--rule); border-radius: 5px; background: transparent; color: var(--ink); font: 600 14px var(--mono); cursor: pointer; }
.rate button.on { background: var(--blue); border-color: var(--blue); color: var(--sheet); }
.rate-ends { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--ink-soft); }
textarea, input[type=text], input[type=password], input[type=number], select { width: 100%; font: 16px var(--font); color: var(--ink); background: transparent; border: 0; border-bottom: 1.5px dashed var(--ink-soft); padding: 6px 2px; border-radius: 0; }
textarea { min-height: 44px; resize: vertical; }
select { border: 1px solid var(--rule); border-radius: 6px; padding: 8px; background: var(--sheet); }
textarea:focus, input:focus, select:focus { outline: none; border-bottom-color: var(--blue); border-bottom-style: solid; }
label.f { display: flex; flex-direction: column; gap: 4px; font: 600 12px var(--mono); color: var(--ink-soft); letter-spacing: .04em; text-transform: uppercase; }

.hr { border: 2px dashed var(--stamp); border-radius: 4px; padding: 14px; background: var(--stamp-soft); display: flex; flex-direction: column; gap: 6px; font: 13px var(--mono); }
.hr b { font: 800 16px var(--font); color: var(--stamp); }
.notice { font-size: 14px; color: var(--ink-soft); background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }

.big { font: 800 18px var(--font); padding: 15px; border-radius: 8px; border: 0; background: var(--stamp); color: #fff; cursor: pointer; width: 100%; }
.big.blue { background: var(--blue); color: var(--sheet); }
.big:disabled { opacity: .5; }
.ghost { font: 600 14px var(--mono); padding: 11px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
.ghost.danger { color: var(--stamp); border-color: var(--stamp); }
.small { font: 600 12px var(--mono); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > * { min-width: 0; }
.grow { flex: 1; }
.card { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.done-card { text-align: center; align-items: stretch; }
.stamp2 { align-self: center; border: 3px solid var(--stamp); color: var(--stamp); font: 700 18px var(--mono); letter-spacing: .1em; padding: 6px 12px; transform: rotate(-4deg); border-radius: 4px; text-transform: uppercase; }
.stamp2.good { border-color: var(--good); color: var(--good); }

/* owner */
.tabs { display: flex; gap: 6px; }
.tab { flex: 1; font: 600 13px var(--mono); padding: 9px 4px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.app-item { text-align: left; width: 100%; cursor: pointer; color: var(--ink); font: inherit; }
.pill { font: 600 11px var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
.pill.new { border: 1px solid var(--rule); color: var(--ink-soft); }
.pill.filling { background: var(--blue-soft); color: var(--blue); }
.pill.sub { background: var(--good-soft); color: var(--good); }
.pill.verdict { background: var(--stamp-soft); color: var(--stamp); }
.pill.skip { background: var(--skip); color: var(--sheet); }
.meta { font: 12px var(--mono); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.linkbox { font: 13px var(--mono); background: var(--blue-soft); padding: 8px 10px; border-radius: 6px; overflow-wrap: anywhere; user-select: all; }
.sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sum div { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 10px; text-align: center; }
.sum b { display: block; font: 800 24px var(--font); font-variant-numeric: tabular-nums; }
.sum span { font: 11px var(--mono); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .06em; }
.ro { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 5px; font-size: 14px; color: var(--ink-soft); }
.ro.picked { background: var(--blue-soft); color: var(--ink); font-weight: 600; }
.ro .box { width: 16px; height: 16px; border-color: var(--rule); font-size: 11px; }
.ro.picked .box { background: var(--blue); border-color: var(--blue); }
.answer-text { font-size: 15px; padding: 8px 10px; background: var(--blue-soft); border-radius: 5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.badge { align-self: flex-start; }
.verdicts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.verdicts button { font: 600 12px var(--mono); padding: 10px 6px; border-radius: 6px; border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer; }
.verdicts button.on { background: var(--stamp); border-color: var(--stamp); color: #fff; }
.verdicts button.good.on { background: var(--good); border-color: var(--good); }
.toggle { display: flex; gap: 10px; align-items: center; font-size: 15px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; }
.qrow { display: flex; gap: 8px; align-items: flex-start; }
.qrow .t { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
.qrow .k { font: 11px var(--mono); color: var(--ink-soft); text-transform: uppercase; }
.qrow .ctl { display: flex; gap: 4px; flex: none; }
.qrow .ctl button { width: 34px; height: 34px; padding: 0; }
.confirm { background: var(--stamp-soft); border: 1px solid var(--stamp); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); font: 600 14px var(--mono); padding: 10px 16px; border-radius: 999px; z-index: 20; max-width: calc(100% - 32px); text-align: center; }
.empty { border: 1px dashed var(--rule); border-radius: 4px; padding: 22px 16px; text-align: center; color: var(--ink-soft); }
.result-card { border: 2px solid var(--stamp); background: var(--sheet); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; text-align: center; margin-top: 16px; }
.result-card.good { border-color: var(--good); }
.score { font: 800 40px var(--font); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

async function rpc(name, args) {
  let r;
  try {
    r = await fetch(`${SB_URL}/rest/v1/rpc/${name}`, {
      method: "POST",
      headers: { apikey: SB_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(args || {})

function when(iso) {
  if (!iso) return "";
  const d = new Date(iso), s = (Date.now() - d) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";

function groupBySection(qs) { const out = []; qs.forEach(q => { let g = out[out.length - 1]; if (!g || g.section !== q.section) { g = { section: q.section, qs: [] }; out.push(g); } g.qs.push(q); }); return out; }

async function applicantPage(token) {
  const LANG_KEY = "lang-" + token;
  let lang = store.get(LANG_KEY) || guessLang();
  let data;
  try { data = await rpc("applicant_open", { p_token: token }); }
  catch (e) { setDocLang(lang); return showError(e.code === "offline" ? STR[lang].offline : e.message, lang); }
  if (!data) { setDocLang(lang); return showError(STR[lang].badLink, lang); }

  const Q = data.questions || [];
  const avail = LANGS.map(x => x[0]).filter(l => l === "en" ||
    Q.some(q => q.tr && q.tr[l]) || (data.tr && data.tr[l]));
  lang = store.get(LANG_KEY) || data.lang || "en";
  if (!avail.includes(lang)) lang = "en";

  const LOCAL = "draft-" + token;

  } catch (e) {}
  let submittedAt = data.submitted_at;
  let saveKey = Object.keys(A).length ? "saved" : "autosave";
  const isAnswered = id => !!A[id] && !A[id].skip && A[id].v !== undefined && String(A[id].v).trim() !== "";
  const isSkipped = id => !!(A[id] && A[id].skip);

  /* translated text */

  const T = q => (lang !== "en" && q.tr && q.tr[lang]) || {};
  const qText = q => T(q).text || q.text;
  const qHint = q => q.hint ? (T(q).hint || q.hint) : (T(q).hint || null);
  const qOpt = (q, i) => (T(q).options && T(q).options[i]) || q.options[i];
  const qSection = q => T(q).section || q.section;
  const st = k => (lang !== "en" && data.tr && data.tr[lang] && data.tr[lang][k]) || data[k];

  let ui = {}, cards = {};

    setDocLang(lang);
    document.title = st("form_title");

    const top = el("div", "topbar");
    if (avail.length > 1) {
      const sw = el("div", "langs"); sw.setAttribute("role", "group"); sw.setAttribute("aria-label", "Language / 语言");
      avail.forEach(l => {

        b.setAttribute("aria-pressed", String(l === lang));
        b.addEventListener("click", () => {
          if (l === lang) return;

      });
      top.append(sw);
    }
    const prog = el("div", "progress"); const bar = el("div", "bar"); ui.pa = el("i", "a"); ui.ps = el("i", "s"); bar.append(ui.pa, ui.ps);
    ui.pt = el("span"); prog.append(bar, ui.pt);
    ui.saveState = el("div", "savestate", S()[saveKey]);
    top.append(prog, ui.saveState);
    ui.top = top;
    ui.formView = el("div", "wrap"); ui.doneView = el("div", "wrap"); ui.doneView.hidden = true;
    $app.append(top, ui.formView, ui.doneView);
    const F = ui.formView;

    if (data.result) F.append(resultCard(data.result, lang));
    const head = el("header", "head");
    head.append(el("div", "stamp", S().stamp), el("div", "formno", S().applicant + data.name), el("h1", null, st("form_title")));
    const fl = el("div", "funline");

    if (st("praise")) fl.append(el("div", "praise", st("praise")));
    if (fl.childNodes.length) head.append(fl);
    if (submittedAt) head.append(el("div", "msg", S().alreadySent(new Date(submittedAt).toLocaleString(lang, { dateStyle: "medium", timeStyle: "short" }))));
    F.append(head);

    groupBySection(Q).forEach(g => {
      const box = el("div", "section"); box.append(sectionHeader(qSection(g.qs[0])));

    });

    const hr = el("div", "hr");
    hr.append(el("b", null, S().hrTitle));
    S().hrLines.forEach(t => hr.append(el("div", null, t)));
    const notice = el("div", "notice");

    ui.leftNote = el("div", "msg");

  function buildQ(q) {
    const card = el("div", "q"); cards[q.id] = card;
    const topRow = el("div", "q-top");
    const qt = el("div", "q-text", qText(q));
    const sk = el("button", "skipbtn", S().skip); sk.type = "button";

    const hint = qHint(q);

    const body = el("div", "body"); card.append(body);
    if (q.kind === "single") {
      const opts = el("div", "opts");
      (q.options || []).forEach((o, i) => {
        const b = el("button", "opt"); b.type = "button";
        b.append(el("span", "box", "✓"), el("span", null, qOpt(q, i)));
        // answers are always saved with the English option, so HR reads them in English
        b.addEventListener("click", () => { if (A[q.id] && A[q.id].v === o) delete A[q.id]; else A[q.id] = { v: o }; refresh(q); });
        opts.append(b);

      body.append(opts);
    } else if (q.kind === "rate") {
      const r = el("div", "rate");
      for (let i = 1; i <= 10; i++) {
        const b = el("button", null, String(i)); b.type = "button";
        b.addEventListener("click", () => { if (A[q.id] && A[q.id].v === i) delete A[q.id]; else A[q.id] = { v: i }; refresh(q); });
        r.append(b);
      }
      const ends = el("div", "rate-ends"); ends.append(el("span", null, S().rateLow), el("span", null, S().rateHigh));
      body.append(r, ends);
    } else {
      const long = q.text.length > 40;

      inp.id = "in-" + q.id; inp.placeholder = S().typeHere; inp.setAttribute("aria-label", qText(q));
      if (A[q.id] && !A[q.id].skip) inp.value = A[q.id].v || "";

      body.append(inp);
    }

  }
  function refresh(q, quiet) {
    const c = cards[q.id];
    c.classList.toggle("skipped", isSkipped(q.id));
    c.classList.toggle("done", isAnswered(q.id));
    c.querySelector(".skipbtn").textContent = isSkipped(q.id) ? S().skipped : S().skip;
    const v = A[q.id] && !A[q.id].skip ? A[q.id].v : undefined;
    if (q.kind === "single") c.querySelectorAll(".opt").forEach((b, i) => b.setAttribute("aria-pressed", String(q.options[i] === v)));
    if (q.kind === "rate") c.querySelectorAll(".rate button").forEach((b, i) => b.classList.toggle("on", i + 1 === v));
    if (q.kind === "text" && isSkipped(q.id)) c.querySelector("input,textarea").value = "";
    progress();
    if (!quiet) queueSave();
  }
  function counts() { const a = Q.filter(q => isAnswered(q.id)).length, s = Q.filter(q => isSkipped(q.id)).length; return { a, s, left: Q.length - a - s }; }
  function progress() {

    ui.pt.textContent = S().progress(a, s, left);

  }

  /* autosave */
  let saveTimer = null, saving = false, pending = false;
  function payload() { const o = {}; Q.forEach(q => { const x = A[q.id]; if (!x) return; if (x.skip) o[q.id] = { skip: true }; else if (String(x.v).trim() !== "") o[q.id] = { v: x.v }; }); return o; }
  function queueSave() {

    clearTimeout(saveTimer); saveTimer = setTimeout(() => save(false), 1200);
  }
  async function save(submit) {
    if (saving) { pending = true; return null; }

}

}

/* --- one applicant --- */
async function detailView(id) {
  clearInterval(pollTimer); pollTimer = null;
  $main.replaceChildren(el("div", "empty", "Loading…"));
  window.scrollTo(0, 0);
  let a;
  try { a = await owner("owner_get_application", { p_id: id }); } catch (e) { $main.replaceChildren(el("div", "err", e.message)); return; }
  if (!a) { appsTab(); return; }
  $main.replaceChildren();
  const back = el("button", "ghost", "← All applicants"); back.addEventListener("click", appsTab);
  back.style.marginTop = "12px";
  const head = el("div", "head");
  const r1 = el("div", "row"); r1.append(el("h2", "grow", a.name), statusPill({ submitted_at: a.submitted_at, updated_at: a.updated_at, answered: a.answered_count, skipped: a.skipped_count, opened_at: a.opened_at }));
  head.append(el("div", "formno", "Applicant file"), r1);
  const times = [["Sent", a.created_at], ["Opened", a.opened_at], ["Last activity", a.updated_at], ["Submitted", a.submitted_at]].filter(x => x[1]).map(x => x[0] + ": " + when(x[1])).join(" · ");
  head.append(el("div", "meta", "Form language: " + langName(a.lang || "en") + " · " + times));
  if (a.lang && a.lang !== "en") head.append(el("div", "msg", "Picked options are shown in English. For typed answers in Chinese, tap “Translate to English” under the answer."));
  const link = linkFor(a.token);
  head.append(el("div", "linkbox", link));
  const cl = el("button", "ghost", "Copy their link"); cl.addEventListener("click", () => copyText(link, cl)); head.append(cl);
  const Q = a.questions || [], ans = a.answers || {};
  const sum = el("div", "sum");
  [[a.answered_count, "Answered"], [a.skipped_count, "Skipped"], [Q.length - a.answered_count - a.skipped_count, "Left empty"]].forEach(([n, l]) => { const d = el("div"); d.append(el("b", null, String(n)), el("span", null, l)); sum.append(d); });
  const refresh = el("button", "ghost", "Refresh answers"); refresh.addEventListener("click", () => detailView(id));
  $main.append(back, head, sum, reviewPanel(a), refresh);

  groupBySection(Q).forEach(g => {
    const box = el("div", "section"); box.append(sectionHeader(g.section));
    g.qs.forEach(q => {
      const r = ans[q.id];
      const card = el("div", "q" + (r && r.skip ? " skipped" : r ? " done" : ""));
      card.append(el("div", "q-text", q.text));
      if (r && r.skip) card.append(el("span", "pill skip badge", "Skipped"));
      else if (!r) card.append(el("span", "pill new badge", "No answer"));
      if (q.kind === "single") {
        (q.options || []).forEach(o => { const on = r && !r.skip && r.v === o; const row = el("div", "ro" + (on ? " picked" : "")); row.append(el("span", "box", on ? "✓" : ""), el("span", null, o)); card.append(row); });
      } else if (q.kind === "rate") {
        card.append(r && !r.skip ? el("div", "answer-text", r.v + " / 10") : el("div", "rate-ends", "Scale: 1 to 10"));
      } else if (r && !r.skip) {
        card.append(el("div", "answer-text", String(r.v)));
        if (hasCJK(r.v)) card.append(gtLink(String(r.v), "en"));
      }
      box.append(card);
    });
    $main.append(box);
  });

  const del = el("button", "ghost danger", "Delete this applicant");
  const confirmBox = el("div", "confirm"); confirmBox.hidden = true;
  confirmBox.append(el("div", null, `Delete ${a.name} and all their answers? This can't be undone.`));
  const yes = el("button", "ghost danger", "Yes, delete"), no = el("button", "ghost", "Cancel");
  const cr = el("div", "row"); cr.append(yes, no); confirmBox.append(cr);
  del.addEventListener("click", () => { confirmBox.hidden = false; del.hidden = true; });
  no.addEventListener("click", () => { confirmBox.hidden = true; del.hidden = false; });
  yes.addEventListener("click", async () => { try { await owner("owner_delete_application", { p_id: id }); toast("Deleted"); appsTab(); } catch (e) { toast(e.message); } });
  del.style.marginTop = "24px";
  $main.append(del, confirmBox);
}
function reviewPanel(a) {
  const c = el("div", "hr");
  c.append(el("b", null, "HR USE ONLY"));
  let verdict = a.verdict || "";
  const vg = el("div", "verdicts");
  VERDICTS.forEach(([k, l, good]) => {
    const b = el("button", good ? "good" : "", l); b.type = "button";
    b.classList.toggle("on", verdict === k);
    b.addEventListener("click", () => { verdict = verdict === k ? "" : k; vg.querySelectorAll("button").forEach((x, i) => x.classList.toggle("on", VERDICTS[i][0] === verdict)); });
    vg.append(b);
  });
  const sf = el("label", "f", "Overall score / 100"); const si = el("input"); si.type = "number"; si.min = 0; si.max = 100; si.inputMode = "numeric"; si.id = "score"; if (a.score != null) si.value = a.score; sf.append(si);
  const nf = el("label", "f", "Notes"); const nt = el("textarea"); nt.id = "notes"; nt.value = a.notes || ""; nf.append(nt);
  const extra = el("div", "wrap");
  if (a.lang && a.lang !== "en") {
    extra.append(el("div", "meta", "They read " + langName(a.lang) + ". The verdict shows in their language automatically. Your note shows exactly as you type it, so you can translate it first:"));
    const tl = el("button", "small", "Translate my note to " + langName(a.lang) + " ↗"); tl.type = "button";
    tl.addEventListener("click", () => {
      if (!nt.value.trim()) { toast("Type a note first"); return; }
      const l = gtLink(nt.value, a.lang); l.click();
    });
    extra.append(tl);
  }
  const tg = el("label", "toggle"); const cb = el("input"); cb.type = "checkbox"; cb.id = "share"; cb.checked = !!a.result_shared;
  tg.append(cb, el("span", null, "Show this result to them (verdict, score and notes)"));
  const save = el("button", "big", "Save HR decision");
  const err = el("div", "err");
  save.addEventListener("click", async () => {
    err.textContent = "";
    let score = si.value === "" ? null : Math.round(Number(si.value));
    if (score != null && (isNaN(score) || score < 0 || score > 100)) { err.textContent = "Score must be between 0 and 100."; return; }
    save.disabled = true;
    try { await owner("owner_review", { p_id: a.id, p_verdict: verdict, p_score: score, p_notes: nt.value, p_share: cb.checked }); toast(cb.checked ? "Saved · they can see it now" : "Saved · only you can see it"); }
    catch (e) { err.textContent = e.message; }
    save.disabled = false;
  });
  c.append(vg, sf, nf, extra, tg, err, save);
  return c;
}

/* --- questions editor --- */
let QS = [];
const ZH = ["zh-Hans", "zh-Hant"];
async function questionsTab() {
  $main.replaceChildren(el("div", "empty", "Loading questions…"));
  try { QS = await owner("owner_list_questions"); } catch (e) { $main.replaceChildren(el("div", "err", e.message)); return; }
  renderQuestions();
}
function renderQuestions() {
  $main.replaceChildren();
  const head = el("div", "head");
  const missing = QS.filter(q => !ZH.every(l => q.tr && q.tr[l] && q.tr[l].text)).length;
  head.append(el("div", "formno", `${QS.length} questions`), el("h2", null, "Questions"));
  head.append(el("div", "msg", "Changes here only affect NEW links. People who already have a link keep the questions they got."));
  if (missing) head.append(el("div", "meta", `${missing} question${missing > 1 ? "s have" : " has"} no Chinese yet (marked EN only). They show in English on Chinese links.`));
  const add = el("button", "big blue", "+ Add a question");
  add.addEventListener("click", () => editQuestion(null));
  head.append(add);
  $main.append(head);
  groupBySection(QS).forEach(g => {
    const box = el("div", "section"); box.append(sectionHeader(g.section));
    g.qs.forEach(q => {
      const c = el("div", "card");
      const row = el("div", "qrow");
      const t = el("div", "t");
      const kinds = el("div", "k", { text: "Written", single: "Choice", rate: "1–10" }[q.kind]);
      const has = ZH.filter(l => q.tr && q.tr[l] && q.tr[l].text).map(langShort);
      kinds.append(document.createTextNode(" · " + (has.length ? "EN " + has.join(" ") : "EN only")));
      t.append(kinds, el("div", null, q.text));
      if (q.kind === "single") t.append(el("div", "meta", (q.options || []).join(" · ")));
      const ctl = el("div", "ctl");
      const idx = QS.indexOf(q);
      const up = el("button", "small", "↑"), dn = el("button", "small", "↓"), ed = el("button", "small", "✎");
      up.setAttribute("aria-label", "Move up"); dn.setAttribute("aria-label", "Move down"); ed.setAttribute("aria-label", "Edit");
      up.disabled = idx === 0; dn.disabled = idx === QS.length - 1;
      up.addEventListener("click", () => move(idx, -1)); dn.addEventListener("click", () => move(idx, 1));
      ed.addEventListener("click", () => editQuestion(q));
      ctl.append(up, dn, ed);
      row.append(t, ctl); c.append(row); box.append(c);
    });
    $main.append(box);
  });
}
function sectionTr(section) {
  // the Chinese name of a section, taken from any question already in it
  const out = {};
  QS.forEach(x => { if (x.section === section && x.tr) ZH.forEach(l => { if (!out[l] && x.tr[l] && x.tr[l].section) out[l] = x.tr[l].section; }); });
  return out;
}
async function move(i, d) {
  const j = i + d; if (j < 0 || j >= QS.length) return;
  const a = QS[i], b = QS[j];
  if (a.section !== b.section) {
    // moving across a section boundary joins that section
    a.section = b.section;
    const st = sectionTr(b.section);
    a.tr = Object.assign({}, a.tr || {});
    ZH.forEach(l => { if (a.tr[l]) a.tr[l] = Object.assign({}, a.tr[l], { section: st[l] || undefined }); });
  }
  [QS[i], QS[j]] = [QS[j], QS[i]];
  renderQuestions();
  try {
    await owner("owner_save_question", { p_id: a.id, p_section: a.section, p_kind: a.kind, p_text: a.text, p_hint: a.hint, p_options: a.options, p_position: null, p_tr: a.tr || {} });
    await owner("owner_reorder_questions", { p_ids: QS.map(q => q.id) });
  } catch (e) { toast(e.message); questionsTab(); }
}
function editQuestion(q) {
  window.scrollTo(0, 0);
  const isNew = !q;
  q = q || { section: QS.length ? QS[QS.length - 1].section : "Section 1 · Questions", kind: "text", text: "", hint: "", options: [], tr: {} };
  const tr0 = q.tr || {};
  $main.replaceChildren();
  const c = el("div", "head");
  c.append(el("div", "formno", isNew ? "New question" : "Edit question"));
  const sections = [...new Set(QS.map(x => x.section))];
  const sf = el("label", "f", "Section"); const ss = el("select"); ss.id = "qsection";
  sections.forEach(s => { const o = el("option", null, s); o.value = s; ss.append(o); });
  const newOpt = el("option", null, "+ New section…"); newOpt.value = "__new"; ss.append(newOpt);
  ss.value = sections.includes(q.section) ? q.section : "__new";
  const sn = el("input"); sn.type = "text"; sn.id = "qsectionnew"; sn.placeholder = "e.g. Section 13 · Bonus round"; sn.hidden = ss.value !== "__new";
  if (ss.value === "__new") sn.value = q.section || "";
  sf.append(ss, sn);
  const kf = el("label", "f", "Answer type"); const ks = el("select"); ks.id = "qkind";
  [["text", "Written answer"], ["single", "Choose one option"], ["rate", "Rating 1 to 10"]].forEach(([v, l]) => { const o = el("option", null, l); o.value = v; ks.append(o); });
  ks.value = q.kind; kf.append(ks);
  const tf = el("label", "f", "Question"); const ti = el("textarea"); ti.id = "qtext"; ti.value = q.text; tf.append(ti);
  const hf = el("label", "f", "Small note under it (optional)"); const hi = el("input"); hi.type = "text"; hi.id = "qhint"; hi.value = q.hint || ""; hf.append(hi);
  const of = el("label", "f", "Options – one per line"); const oi = el("textarea"); oi.id = "qopts"; oi.rows = 5; oi.value = (q.options || []).join("\n"); of.append(oi);

  /* Chinese */
  const zh = el("details", "zh"); zh.open = !!(tr0["zh-Hans"] || tr0["zh-Hant"]);
  zh.append(el("summary", null, "Chinese translation (简体 / 繁體)"));
  zh.append(el("div", "meta", "Optional. Anything left empty shows in English on Chinese links. If you change the English question, update the Chinese too — tap the Translate button, or ask Claude."));
  const zf = {};
  ZH.forEach(l => {
    const t = tr0[l] || {};
    const box = el("div", "zhbox"); box.lang = l;
    box.append(el("div", "formno", langName(l)));
    const f1 = el("label", "f", "Question"); const i1 = el("textarea"); i1.id = "zq-" + l; i1.value = t.text || ""; f1.append(i1);
    const f2 = el("label", "f", "Small note"); const i2 = el("input"); i2.type = "text"; i2.id = "zh-" + l; i2.value = t.hint || ""; f2.append(i2);
    const f3 = el("label", "f", "Options – same order, one per line"); const i3 = el("textarea"); i3.id = "zo-" + l; i3.rows = 5; i3.value = (t.options || []).join("\n"); f3.append(i3);
    const f4 = el("label", "f", "Section name"); const i4 = el("input"); i4.type = "text"; i4.id = "zs-" + l; i4.value = t.section || ""; f4.append(i4);
    const tb = el("button", "small", "Translate English → " + langName(l) + " ↗"); tb.type = "button";
    tb.addEventListener("click", () => {
      const src = [ti.value, ks.value === "single" ? oi.value : ""].filter(Boolean).join("\n\n");
      if (!src.trim()) { toast("Type the English question first"); return; }
      gtLink(src, l).click();
    });
    box.append(f1, f2, f3, f4, tb);
    zf[l] = { text: i1, hint: i2, options: i3, section: i4, optField: f3 };
    zh.append(box);
  });
  const fillSectionTr = () => {
    const name = ss.value === "__new" ? sn.value.trim() : ss.value;
    const st = sectionTr(name);
    ZH.forEach(l => { if (!zf[l].section.value && st[l]) zf[l].section.value = st[l]; });
  };
  ss.addEventListener("change", () => { sn.hidden = ss.value !== "__new"; fillSectionTr(); });
  if (isNew) fillSectionTr();
  const syncKind = () => { const s = ks.value === "single"; of.hidden = !s; ZH.forEach(l => zf[l].optField.hidden = !s); };
  ks.addEventListener("change", syncKind); syncKind();

  const err = el("div", "err");
  const save = el("button", "big blue", "Save question");
  const cancel = el("button", "ghost", "Cancel");
  cancel.addEventListener("click", renderQuestions);
  save.addEventListener("click", async () => {
    err.textContent = "";
    const section = ss.value === "__new" ? sn.value.trim() : ss.value;
    const opts = oi.value.split("\n").map(s => s.trim()).filter(Boolean);
    const tr = {};
    for (const l of ZH) {
      const o = {};
      const t = zf[l].text.value.trim(), h = zf[l].hint.value.trim(), s = zf[l].section.value.trim();
      const zo = zf[l].options.value.split("\n").map(x => x.trim()).filter(Boolean);
      if (t) o.text = t;
      if (h) o.hint = h;
      if (s) o.section = s;
      if (ks.value === "single" && zo.length) {
        if (zo.length !== opts.length) { err.textContent = `${langName(l)}: you have ${zo.length} Chinese options but ${opts.length} English ones. They must match line by line.`; return; }
        o.options = zo;
      }
      if (Object.keys(o).length) tr[l] = o;
    }
    save.disabled = true;
    try {
      await owner("owner_save_question", { p_id: isNew ? null : q.id, p_section: section, p_kind: ks.value, p_text: ti.value, p_hint: hi.value, p_options: opts, p_position: isNew ? sectionEndPosition(section) : null, p_tr: tr });
      toast("Saved ✓");
      await questionsTab();
    } catch (e) { err.textContent = e.message; save.disabled = false; }
  });
  c.append(sf, kf, tf, hf, of, zh, err, save, cancel);
  $main.append(c);
  if (!isNew) {
    const del = el("button", "ghost danger", "Delete this question");
    const cb = el("div", "confirm"); cb.hidden = true;
    cb.append(el("div", null, "Delete this question? People who already have a link keep it."));
    const yes = el("button", "ghost danger", "Yes, delete"), no = el("button", "ghost", "Cancel");
    const r = el("div", "row"); r.append(yes, no); cb.append(r);
    del.addEventListener("click", () => { cb.hidden = false; del.hidden = true; });
    no.addEventListener("click", () => { cb.hidden = true; del.hidden = false; });
    yes.addEventListener("click", async () => { try { await owner("owner_delete_question", { p_id: q.id }); toast("Deleted"); questionsTab(); } catch (e) { toast(e.message); } });
    $main.append(del, cb);
  }
}
function sectionEndPosition(section) {
  // new question goes at the end of its section (or at the very end for a new section)
  let last = -1; QS.forEach((x, i) => { if (x.section === section) last = i; });
  if (last < 0) return null;
  const here = QS[last].position, next = QS[last + 1] ? QS[last + 1].position : here + 20;
  if (next - here >= 2) return Math.floor((here + next) / 2);
  return null;
}

    save.disabled = false;

  c.append(err, save);
  const out = el("button", "ghost", "Log out on this phone");
